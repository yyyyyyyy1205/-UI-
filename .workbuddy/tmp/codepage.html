<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #eef2f7; font-family: "Microsoft YaHei", sans-serif; padding: 24px; }
  .card {
    width: 700px; background: #ffffff; border: 1px solid #d7e0ec; border-radius: 10px;
    overflow: hidden; margin-bottom: 28px; box-shadow: 0 2px 8px rgba(30,60,110,.08);
  }
  .bar {
    background: #2b3a4e; color: #cfe3ff; padding: 9px 16px; font-size: 14px;
    font-family: Consolas, monospace; display: flex; justify-content: space-between;
  }
  .bar .dots span { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; }
  .d1{background:#ff5f57}.d2{background:#febc2e}.d3{background:#28c840}
  pre {
    padding: 16px 18px; font-family: Consolas, "Courier New", monospace; font-size: 15px;
    line-height: 1.65; color: #24313f; background: #fbfdff; white-space: pre; overflow: hidden;
  }
  .kw{color:#a626a4} .str{color:#0e8a4d} .com{color:#9aa5b1;font-style:italic}
  .num{color:#b76b00} .tag{color:#c18401} .attr{color:#986801}
</style>
</head>
<body>
<div id="cards"></div>
<script>
const snippets = [
{ file: "src/main.js —— 创建并注册 Vue Router", code:
`import { createApp } from "vue";
import "./style.css";
import App from "./App.vue";
import router from "./router";   // 引入路由实例

const app = createApp(App);
app.use(router);                 // 注册 Vue Router 插件，全应用生效
app.mount("#app");` },

{ file: "src/router/index.js —— 基础路由、命名路由、重定向与路由元信息", code:
`import { createRouter, createWebHistory } from "vue-router";
import Home from "../views/Home.vue";
import About from "../views/About.vue";

const routes = [
  { path: "/", redirect: "/home" },            // 重定向：访问根路径跳转到首页
  {
    path: "/home",
    name: "Home",                              // 命名路由，可用 name 跳转
    component: Home,
    meta: { title: "首页\u2011个人主页" }        // 路由元信息：保存页面标题
  },
  {
    path: "/about",
    name: "About",
    component: About,
    meta: { title: "关于我" }
  }
];

const router = createRouter({
  history: createWebHistory(),                 // History 路由模式，URL 无 #
  routes
});` },

{ file: "src/router/index.js —— 嵌套路由（项目中心 / 后台管理）", code:
`{
  path: "/project",
  name: "Project",
  component: ProjectLayout,                    // 父路由：提供共享布局
  meta: { title: "项目中心" },
  children: [                                  // 子路由渲染在 RouterView 中
    { path: "", redirect: { name: "ProjectList" } },
    { path: "list", name: "ProjectList",
      component: ProjectList, meta: { title: "项目列表" } },
    { path: "detail/:id", name: "ProjectDetail",          // :id 动态路由参数
      component: ProjectDetail, meta: { title: "项目详情" } }
  ]
},
{
  path: "/admin",
  name: "Admin",
  component: AdminLayout,
  meta: { title: "后台管理", requiresAuth: true },        // meta 标记需要登录
  children: [
    { path: "", redirect: { name: "AdminProfile" } },
    { path: "profile", name: "AdminProfile",
      component: AdminProfile,
      meta: { title: "编辑个人资料", requiresAuth: true } }
  ]
}` },

{ file: "src/views/ProjectDetail.vue —— 动态路由参数的获取（useRoute）", code:
`<template>
  <div class="container">
    <h2>项目详情</h2>
    <p>项目ID：{{ $route.params.id }}</p>   <!-- 模板中直接读取动态参数 -->
    ...
    <button @click="$router.back()">返回</button>
  </div>
</template>

<script setup>
import { useRoute } from "vue-router";
const route = useRoute();                  // 获取当前路由对象
// route.params.id 即 URL 中的动态参数，如 /project/detail/1 时为 "1"
<\/script>` },

{ file: "src/App.vue —— RouterLink 导航与当前路由高亮", code:
`<template>
  <header class="nav-header">
    <nav class="nav">
      <RouterLink to="/home">首页</RouterLink>
      <RouterLink :to="{ name: 'About' }">关于我</RouterLink>
      <RouterLink :to="{ name: 'ProjectList' }">项目中心</RouterLink>
      <RouterLink :to="{ name: 'Admin' }" v-if="isLogin">后台管理</RouterLink>
      <RouterLink :to="{ name: 'Login' }" v-if="!isLogin">登录</RouterLink>
    </nav>
  </header>
  <RouterView />   <!-- 路由出口：页面组件在此渲染 -->
</template>

<style>
.nav a.router-link-active {          /* Vue Router 自动添加的激活类名 */
  font-weight: bold;
  color: #348eda;
  border-bottom: 2px solid #348eda;
}
</style>` },

{ file: "编程式导航 —— router.push / router.go(-1)（节选自三个组件）", code:
`// src/views/ProjectList.vue：push 跳转并携带动态参数
const goDetail = (pid) => {
  router.push({ name: "ProjectDetail", params: { id: pid } });
};

// src/views/About.vue：go(-1) 返回上一页，保留历史记录
const goBack = () => { router.go(-1); };

// src/views/Login.vue：登录成功后按 redirect 参数跳回目标页
const doLogin = () => {
  localStorage.setItem("isLogin", "true");
  router.push(route.query.redirect || "/admin/profile");
};` },

{ file: "src/router/index.js —— 全局前置守卫 beforeEach（标题更新 + 访问控制）", code:
`router.beforeEach((to, from, next) => {
  document.title = to.meta.title || "Vue实验三";   // 统一更新浏览器标题
  if (to.meta.requiresAuth) {                     // 访问需要登录的页面
    const isLogin = localStorage.getItem("isLogin");
    if (isLogin === "true") {
      next();                                     // 已登录，放行
    } else {
      // 未登录：拦截到登录页，并记录原目标地址便于登录后回跳
      next({ name: "Login", query: { redirect: to.fullPath } });
    }
  } else {
    next();                                       // 公开展示页面直接放行
  }
});` },

{ file: "src/router/index.js —— 404 通配符路由 + src/views/Login.vue 模拟登录", code:
`// 404 路由：放在路由表最后，匹配所有未定义的地址
{
  path: "/:pathMatch(.*)*",
  name: "NotFound",
  component: NotFound,
  meta: { title: "404页面不存在" }
}

// Login.vue：模拟登录，写入登录标记后跳回被拦截的页面
const doLogin = () => {
  localStorage.setItem("isLogin", "true");
  const redirectPath = route.query.redirect || "/admin/profile";
  router.push(redirectPath);
};` }
];

const KW = /\b(import|from|const|let|var|function|return|if|else|new|export|default|true|false)\b/g;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(line){
  let s = esc(line);
  if (/\/\/|<!--/.test(line)) {
    const i = s.indexOf('//'); const j = s.indexOf('&lt;!--');
    let idx = -1;
    if(i>=0 && (j<0||i<j)) idx=i; else if(j>=0) idx=j;
    if(idx>=0) return hlPlain(s.slice(0,idx)) + '<span class="com">'+s.slice(idx)+'</span>';
    return hlPlain(s);
  }
  return hlPlain(s);
}
function hlPlain(s){
  return s
    .replace(/("[^"]*")/g,'<span class="str">$1</span>')
    .replace(/('[^']*')/g,'<span class="str">$1</span>')
    .replace(KW,'<span class="kw">$1</span>');
}
document.getElementById('cards').innerHTML = snippets.map((s,i)=>`
  <div class="card" id="c${i}">
    <div class="bar"><span>${s.file}</span><span class="dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></span></div>
    <pre>${s.code.split('\n').map(hl).join('\n')}</pre>
  </div>`).join('');
window.__ready = true;
</script>
</body>
</html>
